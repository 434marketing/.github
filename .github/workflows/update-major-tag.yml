name: Update major version tag

# Force-moves the floating major tag, for example `v2`, to a release tag such
# as v2.1.3. Site repos reference the major tag (`@v2`), so this move delivers
# a release to them. Without the move, `@v2` stays on an old commit and the
# release reaches no site repo. This workflow exists to prevent that failure.
#
# 3 entry points, 1 implementation:
#
#   workflow_call      The normal path. release-please.yml calls this right after
#                      it cuts a release. It must call, and not rely on the
#                      `push` trigger below, because a tag created with
#                      GITHUB_TOKEN starts no other workflow.
#   push (tags)        Fallback for a tag pushed by hand from a laptop. That
#                      push does start workflows.
#   workflow_dispatch  Repair. If the major tag ever points at the wrong commit,
#                      run this with the vX.Y.Z tag it must point at.
#
# The operation is idempotent: if 2 paths run for the same tag, the result is
# the same.

on:
  push:
    tags:
      # Pre-releases do not match, on purpose. Example: v2.1.3-beta.1.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag:
        description: "Release tag that v<major> must point at, for example v2.1.3."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that v<major> must point at, for example v2.1.3."
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v<major> to this release
        env:
          # `inputs` is empty on the push path, where the tag is the ref.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Guard the dispatch and call paths. When release-please.yml calls this
          # workflow, github.ref_name is `main`. A missing or malformed input
          # must fail the run, and must not point the major tag at `main`.
          # A regex, not a glob: the glob v[0-9]*.[0-9]*.[0-9]* also matches a
          # pre-release such as v2.1.0-rc.1, which must never become `v2`.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a release tag::No tag moved. '$TAG' is not a vX.Y.Z tag. Give a release tag such as v2.1.3."
            exit 1
          fi

          # release-please creates the tag through the API a moment earlier.
          # Fetch it into this checkout before anything points at it.
          git fetch --force --tags origin

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error title=Tag not found::No tag moved. '$TAG' does not exist in this repository."
            exit 1
          fi

          MAJOR="${TAG%%.*}"          # v1.2.3 -> v1

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

          {
            echo "### Moved \`$MAJOR\` → \`$TAG\`"
            echo ""
            echo "Every site repo that references \`@$MAJOR\` gets this release on its next deploy."
          } >> "$GITHUB_STEP_SUMMARY"
