name: Update major version tag

# When a release tag like v1.2.3 is pushed, force-move the floating `v1` tag to it.
# Sites reference @v1 by default, so this is what actually delivers a release to them.
#
# Doing this by hand is the failure mode this exists to prevent: a forgotten
# force-push leaves @v1 pointing at a stale commit and the release reaches nobody.

on:
  push:
    tags:
      # Deliberately excludes pre-releases (v1.2.3-beta.1 will not match).
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move v<major> to this release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"          # v1.2.3 -> v1

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

          echo "### Moved \`$MAJOR\` → \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Every site referencing \`@$MAJOR\` picks this up on its next deploy." >> "$GITHUB_STEP_SUMMARY"
