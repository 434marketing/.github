name: Lint PR title

# `main` allows squash and rebase merges only, and squash is the normal path --
# which means the PR TITLE becomes the commit message on `main`, and that commit
# message is the only thing release-please reads to decide the next version.
#
# A title like "Update the deploy workflow" parses as nothing, cuts no release,
# and appears in no changelog. That is a silent failure, so it is gated here.
#
# NOTE: this only guards the squash path. If you rebase-merge instead, every
# individual commit message on the branch is what release-please sees, and this
# check says nothing about them.
#
# Delete this file if you would rather not gate PRs; release-please works
# without it, just less predictably.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    name: Title must be a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Via env, never inline in the script: a PR title is untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|perf|refactor|docs|chore|ci|build|test|style|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if ! printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error title=PR title is not a conventional commit::'$TITLE'"
            {
              echo "### PR title is not a conventional commit"
              echo ""
              echo "Got: \`$TITLE\`"
              echo ""
              echo "Expected \`type(optional-scope): description\`, for example:"
              echo ""
              echo '```'
              echo "feat: add a php_lint input to the prod deploy workflow"
              echo "fix(deps): bump actions/checkout from 6 to 7"
              echo "feat!: require a WPE_INSTALL_ID secret"
              echo '```'
              echo ""
              echo "Types: feat, fix, perf, refactor, docs, chore, ci, build, test, style, revert."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          TYPE="${TITLE%%[(:!]*}"

          {
            echo "### PR title OK"
            echo ""
            echo "\`$TITLE\`"
            echo ""
            case "$TITLE" in
              *'!:'*)
                echo "This is a **breaking change** — it will cut a new MAJOR (\`v2\`)."
                echo ""
                echo "Sites on \`@v1\` will NOT receive it until each one's \`uses:\` line is updated by hand. Make sure that is what you mean."
                ;;
              feat*) echo "Cuts a **MINOR**. Every site on \`@v1\` picks it up automatically." ;;
              fix*)  echo "Cuts a **PATCH**. Every site on \`@v1\` picks it up automatically." ;;
              *)     echo "\`$TYPE\` does **not** cut a release on its own. It will ride along in the changelog of the next \`feat\` or \`fix\`." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
