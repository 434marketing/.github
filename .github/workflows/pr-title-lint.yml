name: Lint PR title

# `main` allows only squash and rebase merges, and squash is the normal path.
# With a squash merge, the PR title becomes the commit message on `main`.
# release-please reads only that commit message to decide the next version.
#
# A title like "Update the deploy workflow" parses as nothing. It cuts no
# release and appears in no changelog. That failure is silent, so this workflow
# blocks it.
#
# Note: this check covers only the squash path. With a rebase merge,
# release-please reads each commit message on the branch, and this check does
# not look at them.
#
# If you do not want to gate PRs, delete this file. release-please works
# without it, but less predictably.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    name: Title must be a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Through `env`, never inline in the script: a PR title is untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|deps|perf|refactor|revert|docs|chore|ci|build|test|style)(\([a-z0-9._/-]+\))?!?: .+'

          if ! printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "::error title=PR title is not a conventional commit::'$TITLE'"
            {
              echo "### PR title is not a conventional commit"
              echo ""
              echo "Got: \`$TITLE\`"
              echo ""
              echo "Expected \`type(optional-scope): description\`, for example:"
              echo ""
              echo '```'
              echo "feat: add a php_lint input to the prod deploy workflow"
              echo "fix(deps): bump actions/checkout from 6 to 7"
              echo "feat!: require a WPE_INSTALL_ID secret"
              echo '```'
              echo ""
              echo "Types: feat, fix, deps, perf, refactor, revert, docs, chore, ci, build, test, style."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          TYPE="${TITLE%%[(:!]*}"

          {
            echo "### PR title OK"
            echo ""
            echo "\`$TITLE\`"
            echo ""
            # release-please releases a type only if the type is visible in
            # changelog-sections. A hidden type gives empty release notes and no
            # release. Keep this list in step with .github/release-please-config.json.
            case "$TITLE" in
              *'!:'*)
                echo "This is a **breaking change**. It cuts a new major version."
                echo ""
                echo "Site repos on the current major tag do not get it until someone edits the \`uses:\` line in each one by hand. Make sure that is what you mean."
                ;;
              feat*)
                echo "Adds this change to the Release PR, which then cuts at least a **minor** version. After the Release PR merges, every site repo on the current major tag gets it on its next deploy."
                ;;
              chore*|ci*|build*|test*|style*)
                echo "\`$TYPE\` is a hidden type. This PR cuts **no release** and appears in no changelog."
                echo ""
                echo "With this title, the change waits on \`main\` until an unrelated change cuts a release. If it alters what the shared workflows do, retitle it \`fix:\` or \`feat:\`."
                ;;
              *)
                echo "Adds this change to the Release PR, which then cuts at least a **patch** version. After the Release PR merges, every site repo on the current major tag gets it on its next deploy."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
