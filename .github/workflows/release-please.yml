name: Release Please

# Versioning for the shared workflows. It runs on every push to `main`, and
# keeps 1 open Release PR that collects the pending changes and shows the
# version they will cut. A merge of the Release PR is the release. It writes
# CHANGELOG.md, updates .github/VERSION and the manifest, and creates the tag
# and the GitHub Release.
#
# The tag alone does not deliver the release. Site repos reference a major tag
# such as `@v2`, so that floating tag must move too. The second job does that.
#
# Why a second job, and not the `push: tags` trigger in update-major-tag.yml: a
# tag created with GITHUB_TOKEN starts no other workflow. With the trigger only,
# release-please would cut v2.1.0, `v2` would stay on v2.0.0, and the release
# would reach no site repo. update-major-tag.yml exists to prevent that
# failure, so this workflow calls it directly.
#
# Token choice. Read this before you change it.
# Verified on 2026-08-27: this repo has `can_approve_pull_request_reviews: true`
# (Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests"). The built-in GITHUB_TOKEN can therefore open the Release PR,
# and no PAT is necessary. If you can, keep it that way. The "Vendor Gate"
# ruleset of the org requires 1 approving review on `main`, and you can approve
# a PR that github-actions[bot] opened. With a PAT, the Release PR is your own
# PR, which you cannot approve.
# If that setting is ever turned off, add a fine-grained PAT with Contents:
# read/write and Pull requests: read/write, and use it here.

on:
  push:
    branches: [main]

# The default workflow permission in this repo is `read`. Each job that
# writes sets its own permissions.
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Explain a permissions failure
        if: failure()
        run: |
          echo "::error title=release-please failed::Look in the log for: GitHub Actions is not permitted to create or approve pull requests. If it is there, turn on that setting in Settings -> Actions -> General. As an alternative, use a PAT. See the comment at the top of this workflow file."

      - name: Summary
        if: success()
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PRS: ${{ steps.release.outputs.prs_created }}
        run: |
          set -euo pipefail
          {
            echo "### Release Please"
            echo ""
            if [ "${RELEASED}" = "true" ]; then
              echo "Cut release **${TAG}**. The next job in this run moves the \`v<major>\` tag to it."
              echo ""
              echo "Every site repo on the same major tag gets this release on its next deploy."
            elif [ "${PRS}" = "true" ]; then
              echo "Release PR opened or updated. Merge it when you want to cut a release."
            else
              echo "No releasable changes on this push."
              echo ""
              echo "\`feat\` cuts a minor, and a breaking change (\`!\` or a \`BREAKING CHANGE:\` footer) cuts a major. \`fix\`, \`docs\`, \`perf\`, \`deps\`, \`refactor\` and \`revert\` cut a patch. \`chore\`, \`ci\`, \`build\`, \`test\` and \`style\` cut nothing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Delivery. Without this job, the tag exists but nothing reaches a site repo.
  move-major-tag:
    name: Move v<major> to the new release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/update-major-tag.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
