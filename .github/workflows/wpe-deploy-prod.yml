name: WP Engine Production Deploy

# DEPRECATED as of v2 — superseded by `wpe-deploy.yml`, which does every
# environment from one file. This is kept so nothing pinned to `@v1` breaks.
# See the README's migration section. Fixes still land here; features do not.

on:
  workflow_call:
    inputs:
      theme_path:
        description: "Source path within repo root (e.g. themes/my-theme/)"
        required: true
        type: string
      remote_path:
        description: "Remote path on WP Engine (e.g. wp-content/themes/my-theme/)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Backup WP Engine Production
        # Every value below reaches the script through `env`, never inlined into
        # it. A PR title is untrusted input: `${{ }}` is substituted textually
        # BEFORE bash parses the script, so an inlined title containing an
        # apostrophe closes the quoted JSON payload and the remainder is parsed
        # as shell. That broke a real deploy (title: "... the `location` CPT's
        # rewrite rules" -> syntax error near unexpected token `)'), and a title
        # crafted with $(...) after an apostrophe would have executed against a
        # runner holding the WPE SSH key and API credentials.
        #
        # Same rule pr-title-lint.yml already follows. jq builds the JSON so the
        # title is escaped as data rather than concatenated into it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BACKUP_EMAIL: ${{ vars.BACKUP_NOTIFICATION_EMAIL }}
          WPE_INSTALL_ID: ${{ secrets.WPE_INSTALL_ID }}
          WPE_API_USER_ID: ${{ secrets.WPE_API_USER_ID }}
          WPE_API_PASSWORD: ${{ secrets.WPE_API_PASSWORD }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg desc "Pre-deploy backup (${PR_TITLE})" \
            --arg email "${BACKUP_EMAIL}" \
            '{description: $desc, notification_emails: [$email]}')

          curl -sS --fail-with-body -X POST \
            "https://api.wpengineapi.com/v1/installs/${WPE_INSTALL_ID}/backups" \
            -u "${WPE_API_USER_ID}:${WPE_API_PASSWORD}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Deploy to WP Engine Production
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_PROD_ENV }}
          REMOTE_PATH: ${{ inputs.remote_path }}
          SRC_PATH: ${{ inputs.theme_path }}
          PHP_LINT: TRUE
          # `--inplace` is deliberately ABSENT. It wrote incoming bytes straight
          # into the live destination file; rsync's default writes a temp file in
          # the destination directory and rename()s it over the target, which is
          # atomic within a directory, so a request that reads a template
          # mid-deploy gets a whole file rather than a splice of two. rsync's
          # manual on --inplace: "The file's data will be in an inconsistent state
          # during the transfer and will be left that way if the transfer is
          # interrupted or if an update fails." A live WordPress theme is the
          # textbook in-use file. --inplace also implies --partial, so an
          # interrupted run LEAVES the broken bytes in place.
          FLAGS: >-
            -azvr --delete
            --exclude=.*
            --exclude=node_modules
            --exclude=package.json
            --exclude=package-lock.json
            --exclude=yarn.lock
            --exclude=vite.config.js
            --exclude=webpack.mix.js
            --exclude=gulpfile.js
            --exclude=postcss.config.js
          CACHE_CLEAR: TRUE

      - name: Determine bump type from PR labels
        id: bump
        env:
          # Via env for the same reason as the backup step: label names are
          # user-supplied and would otherwise be inlined into the script.
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate new version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${CURRENT#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          BUMP="${{ steps.bump.outputs.type }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "new_tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \":rotating_light: *Prod deploy failed* — <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> @ \`${{ github.sha }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
