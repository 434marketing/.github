; 434 technical-doc-standard lint config.
; Copy this file and the styles/ folder to the root of a repo.
; Docs: skills/technical-doc-standard/SKILL.md in the 434-marketing plugin.

StylesPath = styles
MinAlertLevel = suggestion

; Client-facing templates and generated files are exempt.
[*.md]
BasedOnStyles = 434

; Do not lint fenced code, Mermaid, tables or front matter.
BlockIgnores = (?s)```.*?```, (?s)^---\n.*?\n---\n
TokenIgnores = (`[^`]+`), (\[!\w+\])

[CHANGELOG.md]
BasedOnStyles =

[**/node_modules/**]
BasedOnStyles =
